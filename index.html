<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F2F2F4">
  <script>/* évite le flash de thème au démarrage : applique thème + couleur de barre avant le 1er rendu */
    (function () { try {
      var s = (JSON.parse(localStorage.getItem('present_v2') || '{}').settings || {}), r = document.documentElement;
      if (s.theme === 'dark' || s.theme === 'light') r.dataset.theme = s.theme;
      var dark = s.theme === 'dark' || (s.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.querySelector('meta[name=theme-color]').content = dark ? '#121214' : '#F2F2F4';
    } catch (e) {} })();
  </script>
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Present">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Suivi d’habitudes et time blocking">
